<svg xmlns="http://www.w3.org/2000/svg" width="340" height="54" viewBox="0 0 340 54">
  <defs>
    <filter id="glow-bg" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-txt" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="1;3;1" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="340" height="54" rx="4" ry="4" fill="#5C6630" filter="url(#glow-bg)"/>
  <text x="170" y="34" font-family="'DM Sans', sans-serif" font-size="19" font-weight="600" fill="#D6D0C0" text-anchor="middle" letter-spacing="0.5" filter="url(#glow-txt)">Ver Recursos Gratis</text>
</svg>
