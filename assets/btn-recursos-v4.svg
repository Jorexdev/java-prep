<svg xmlns="http://www.w3.org/2000/svg" width="460" height="64" viewBox="0 0 460 64">
  <defs>
    <filter id="glow-bg" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="3;8;3" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-txt" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="1;3;1" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="460" height="64" rx="4" ry="4" filter="url(#glow-bg)">
    <animate attributeName="fill" values="#5C6630;#7a8a3e;#5C6630" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="0.5" y="0.5" width="459" height="63" rx="4" ry="4" fill="none" stroke="#A3B067">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="230" y="40" font-family="'DM Sans', sans-serif" font-size="22" font-weight="600" fill="#D6D0C0" text-anchor="middle" letter-spacing="0.5" filter="url(#glow-txt)">Ver Recursos Gratis</text>
</svg>
