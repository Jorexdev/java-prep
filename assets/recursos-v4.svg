  <text x="0"  y="100" font-family="'DM Sans', sans-serif" font-size="15" font-weight="700" fill="#A3B067" filter="url(#glow)" opacity="0">·<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/></text>
  <text x="16" y="100" font-family="'DM Sans', sans-serif" font-size="15" font-weight="700" fill="#CCCCCC" opacity="0">Java 21 docs — docs.oracle.com<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/></text>

