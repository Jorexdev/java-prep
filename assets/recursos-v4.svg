<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130">
  <defs>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="0"  y="22"  font-family="'DM Sans', sans-serif" font-size="15" font-weight="700" fill="#A3B067" filter="url(#glow)" opacity="0">·<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.0s" fill="freeze"/></text>
  <text x="16" y="22"  font-family="'DM Sans', sans-serif" font-size="15" font-weight="700" fill="#CCCCCC" opacity="0">Effective Java — Joshua Bloch<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.0s" fill="freeze"/></text>

