<svg xmlns="http://www.w3.org/2000/svg" width="900" height="60" viewBox="0 0 900 60">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="2;9;2" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="390" y="44" font-family="'DM Mono', monospace" font-size="28" font-weight="700" fill="#ffffff" text-anchor="end" opacity="0">//
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>
  <text x="400" y="44" font-family="'DM Mono', monospace" font-size="28" font-weight="700" fill="#A3B067" text-anchor="start" filter="url(#glow)" opacity="0">entrevista
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.4s" fill="freeze"/>
  </text>
</svg>
